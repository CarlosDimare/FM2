
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#94a3b8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FM Argentina" />
    <link rel="apple-touch-icon" href="/FM2/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/FM2/icon-192.svg" />
    <title>FM</title>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #94a3b8;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1e293b;
      }
      body {
        background-color: #94a3b8;
        color: #020617;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      #root::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('/FM2/campo-futbol.jpg') center/cover no-repeat;
        opacity: 0.05;
        z-index: 1;
        pointer-events: none;
      }
      .dark #root::after {
        opacity: 0.05;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      input, select, textarea, button {
        font-size: 16px;
      }

      @keyframes fm-fade-in {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes fm-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fm-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      @keyframes fm-score-flash {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); color: #facc15; }
        100% { transform: scale(1); }
      }
      @keyframes fm-progress-pulse {
        0% { box-shadow: 0 0 2px rgba(250,204,21,0.5); }
        50% { box-shadow: 0 0 8px rgba(250,204,21,0.9); }
        100% { box-shadow: 0 0 2px rgba(250,204,21,0.5); }
      }
      .animate-fade-in {
        animation: fm-fade-in 0.4s ease-out forwards;
      }
      .animate-fade-up {
        animation: fm-fade-up 0.5s ease-out forwards;
      }
      .animate-score-flash {
        animation: fm-score-flash 0.6s ease-out;
      }
      .animate-pulse-slow {
        animation: fm-pulse 2s ease-in-out infinite;
      }
      .animate-progress-pulse {
        animation: fm-progress-pulse 1.5s ease-in-out infinite;
      }
      .animate-overlay-in {
        animation: fm-fade-in 0.2s ease-out forwards;
      }
      @keyframes fm-zoom-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-zoom-in {
        animation: fm-zoom-in 0.2s ease-out forwards;
      }
      @keyframes fm-slide-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      .animate-slide-up {
        animation: fm-slide-up 0.3s ease-out forwards;
      }
    </style>

  </body>
</html>
